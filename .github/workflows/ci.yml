name: Benchmark CI & Telemetry Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute CDC Compaction & Telemetry Benchmark
        run: |
          python benchmark_cdc.py

      - name: Verify OpenTelemetry Artifact Generated
        run: |
          test -f data_lake/otlp_metrics.json && echo "OTLP metrics successfully verified!"
