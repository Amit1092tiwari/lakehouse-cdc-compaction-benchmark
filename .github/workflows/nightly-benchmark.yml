name: Nightly Scale, Drift & Object Storage Benchmark

on:
  schedule:
    # Run daily at 02:00 UTC (off-peak hours)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      batches:
        description: 'Number of CDC micro-batches to simulate'
        required: false
        default: '1000'
      records_per_batch:
        description: 'Number of mutation records per batch'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  scale-regression-benchmark:
    name: High-Volume Scale & Performance Regression Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute High-Volume Benchmark (${{ inputs.batches || '1000' }} batches)
        env:
          BENCHMARK_BATCHES: ${{ inputs.batches || '1000' }}
          BENCHMARK_RECORDS_PER_BATCH: ${{ inputs.records_per_batch || '50' }}
        run: |
          python benchmark_cdc.py --batches "$BENCHMARK_BATCHES" --records-per-batch "$BENCHMARK_RECORDS_PER_BATCH"

      - name: Verify OpenTelemetry Artifact Generated
        run: |
          test -f data_lake/otlp_metrics.json && echo "OTLP metrics successfully verified!"

      - name: Upload OpenTelemetry Telemetry Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-otlp-telemetry
          path: data_lake/otlp_metrics.json
          retention-days: 30

  dependency-drift-and-security:
    name: Upstream Dependency Drift & Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Latest Dependencies & Audit Tooling
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip install pip-audit

      - name: Run CVE / Vulnerability Security Audit
        run: |
          pip-audit --desc on

      - name: Validate Benchmark on Python ${{ matrix.python-version }} with Latest Libraries
        run: |
          python benchmark_cdc.py --batches 300

  docker-compose-integration:
    name: Containerized S3 (MinIO) End-to-End Stack Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Full Docker Compose Stack
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from benchmark-runner

      - name: Teardown Docker Compose Resources
        if: always()
        run: |
          docker compose down -v
