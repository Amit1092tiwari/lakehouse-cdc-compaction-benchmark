version: "3.8"

services:
  # Local S3-compatible Object Storage for Lakehouse Table Slices
  minio-lakehouse:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio-lakehouse
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ingestion & Asynchronous Compaction Benchmark Harness
  benchmark-runner:
    image: python:3.11-slim
    container_name: lakehouse-compaction-benchmark
    depends_on:
      minio-lakehouse:
        condition: service_healthy
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      PYTHONUNBUFFERED: "1"
      S3_ENDPOINT: "http://minio-lakehouse:9000"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadminpassword"
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               python -u benchmark_cdc.py"

